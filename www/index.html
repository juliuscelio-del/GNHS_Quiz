<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GNHS Quiz</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1b33; --card:#16254a; --fg:#eef2ff; --muted:#9db0d8; --accent:#4f8cff; --ok:#3ccf91; }
  @media (prefers-color-scheme: light) { :root { --bg:#eef3ff; --card:#fff; --fg:#14213d; --muted:#5b6b8c; } }
  * { box-sizing: border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:20px; padding-top:calc(20px + env(safe-area-inset-top,0px)); }
  .card { background:var(--card); border-radius:18px; padding:28px; width:100%; max-width:440px; box-shadow:0 10px 40px rgba(0,0,0,.25); text-align:center; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:22px; }
  .spinner { width:42px; height:42px; border:4px solid var(--muted); border-top-color:var(--accent); border-radius:50%; margin:0 auto 14px; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #status { font-size:15px; min-height:22px; }
  .ok #status { color:var(--ok); }
  .ok .spinner { display:none; }
  #list button, #manual button { width:100%; margin-top:10px; padding:12px; font-size:15px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  #manual { margin-top:22px; border-top:1px solid rgba(128,128,128,.25); padding-top:16px; }
  #manual label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  #manual input { width:100%; padding:11px; font-size:16px; border-radius:10px; border:1px solid rgba(128,128,128,.4); background:transparent; color:var(--fg); text-align:center; }
  #retry { width:100%; margin-top:12px; padding:10px; font-size:14px; border:0; background:transparent; color:var(--accent); cursor:pointer; }
  .hidden { display:none; }
  #quiz { position:fixed; inset:0; width:100%; height:100%; border:0; background:#fff; display:none; }
  #finder { position:fixed; inset:0; z-index:10; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; padding-top:calc(20px + env(safe-area-inset-top,0px)); }
  #finder.hidden { display:none; }
</style>
</head>
<body>
<iframe id="quiz" title="GNHS Quiz" allow="fullscreen"></iframe>
<div id="finder">
<div class="card" id="card">
  <h1>Guadalupe NHS Quiz</h1>
  <div class="sub">Connect to your teacher's quiz server</div>
  <div class="spinner" id="spin"></div>
  <div id="status">Searching for your teacher…</div>
  <div id="list"></div>
  <button id="retry" class="hidden">Search again</button>
  <div id="manual">
    <label for="ip">Can't find it? Type the IP your teacher shows (example 192.168.1.5)</label>
    <input id="ip" inputmode="decimal" placeholder="192.168.1.5" autocomplete="off">
    <button id="go">Connect</button>
  </div>
</div>
</div>

<script src="finder-core.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const F = window.FinderCore;
  const desktop = window.gnhs || null;           // present only in the Electron build
  const found = new Map();                       // ip -> {ip, port, name}
  let connecting = false, stop = false, settleTimer = null, runId = 0;

  const urlOf = (s) => `http://${s.ip}:${s.port || F.PORT}`;
  const setStatus = (t) => ($("status").textContent = t);

  const W = window.__gnhsWatch || { everyMs: 3000, fails: 3 };
  let current = null, watchTimer = null, failCount = 0, reconnecting = false;

  function connect(s) {
    if (connecting) return;
    connecting = true; stop = true;
    try { localStorage.setItem("gnhs-last-ip", s.ip); } catch (_) {}
    $("card").classList.add("ok");
    setStatus("Teacher found! Connecting…");
    setTimeout(() => {
      current = s; failCount = 0; reconnecting = false;
      $("quiz").style.display = "block";
      $("quiz").src = urlOf(s);
      $("finder").classList.add("hidden");
      startWatch();
    }, 300);
  }

  // While the quiz is open, keep checking the teacher's server. A short blip is
  // handled by the quiz itself (socket.io reconnects). If the server stays
  // unreachable, the teacher probably changed IP or restarted: search again,
  // and send the student to wherever the teacher is now.
  function startWatch() {
    clearInterval(watchTimer);
    watchTimer = setInterval(async () => {
      if (!current || reconnecting) return;
      const ok = await F.probe(current.ip, current.port || F.PORT, 1500);
      if (ok) { failCount = 0; return; }
      if (++failCount < W.fails) return;
      reconnecting = true;
      $("finder").classList.remove("hidden");
      search();
      setStatus("Lost connection to your teacher. Looking for them again…");
    }, W.everyMs);
  }

  // Wait a moment after the first hit in case several teachers are online.
  function noteFound(s) {
    if (connecting || found.has(s.ip)) return;
    found.set(s.ip, s);
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => {
      const all = [...found.values()];
      if (all.length === 1) return connect(all[0]);
      stop = true; $("spin").classList.add("hidden");
      setStatus("More than one server found. Pick your teacher:");
      $("list").innerHTML = "";
      all.forEach((s) => {
        const b = document.createElement("button");
        b.textContent = `${s.name || "Teacher"} — ${s.ip}`;
        b.onclick = () => connect(s);
        $("list").appendChild(b);
      });
    }, 1500);
  }

  async function search() {
    const my = ++runId;
    stop = false; connecting = false; found.clear(); clearTimeout(settleTimer);
    $("list").innerHTML = ""; $("retry").classList.add("hidden");
    $("spin").classList.remove("hidden"); $("card").classList.remove("ok");
    setStatus("Searching for your teacher…");
    const halted = () => stop || my !== runId;

    // 1) Last server we used — instant reconnect.
    let last = null; try { last = localStorage.getItem("gnhs-last-ip"); } catch (_) {}
    if (last) {
      const hit = await F.probe(last, F.PORT, 800);
      if (hit && !halted()) return noteFound(hit);
    }

    // 2) Desktop: listen for the teacher's UDP beacon while we scan.
    let poll = null;
    if (desktop) {
      poll = setInterval(async () => {
        if (halted()) return clearInterval(poll);
        try { (await desktop.getBeacons()).forEach(noteFound); } catch (_) {}
      }, 400);
    }

    // 2b) Mid-quiz: the teacher may simply come back on the same IP, so keep
    //     re-checking it every 2s instead of waiting for the full scan to finish.
    let ipPoll = null;
    if (current && reconnecting) {
      ipPoll = setInterval(async () => {
        if (halted()) return clearInterval(ipPoll);
        const hit = await F.probe(current.ip, current.port || F.PORT, 1000);
        if (hit && !halted()) noteFound(hit);
      }, 2000);
    }

    // 3) Work out which subnets to scan.
    let prefixes = [];
    if (desktop) { try { prefixes = await desktop.getSubnets(); } catch (_) {} }
    if (!prefixes.length) {
      const own = await F.localPrefixViaWebRTC();
      if (own) prefixes.push(own);
    }
    F.COMMON_PREFIXES.forEach((p) => { if (!prefixes.includes(p)) prefixes.push(p); });

    await F.scan(prefixes, {
      shouldStop: halted,
      onFound: noteFound,
      onProgress: (p) => setStatus(`Searching your network (${p}x)…`),
    });
    if (poll) clearInterval(poll);
    if (ipPoll) clearInterval(ipPoll);

    if (!halted() && !found.size) {
      $("spin").classList.add("hidden");
      $("retry").classList.remove("hidden");
      if (reconnecting) {
        // Mid-quiz: keep trying on our own until the teacher is back.
        setStatus("Teacher's server is offline. Still looking…");
        setTimeout(() => { if (reconnecting && !connecting && my === runId) search(); }, 3000);
      } else {
        setStatus("No teacher found yet. Make sure you're on the same Wi-Fi as your teacher.");
      }
    }
  }

  $("retry").onclick = search;
  $("go").onclick = async () => {
    const ip = $("ip").value.trim();
    if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) return setStatus("Please type a valid IP like 192.168.1.5");
    setStatus("Checking " + ip + "…");
    const hit = await F.probe(ip, F.PORT, 2000);
    if (hit) connect(hit);
    else setStatus("Can't reach a quiz server at " + ip);
  };
  $("ip").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });

  search();
})();
</script>
</body>
</html>
