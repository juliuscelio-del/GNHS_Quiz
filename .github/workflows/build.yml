name: Build Android and Windows apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Every build gets a new version: 1.0.1, 1.0.2, 1.0.3 ...
  VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm test

      # Live updates: lets the installed app download new web files (www/) by
      # itself, so a new APK is only needed when native things change.
      - name: Add live-update plugin
        run: |
          MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npm install "@capgo/capacitor-updater@$MAJOR" || echo "::warning::Could not install @capgo/capacitor-updater@$MAJOR. The app will fall back to APK updates."
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            c.plugins = c.plugins || {};
            c.plugins.CapacitorUpdater = Object.assign({}, c.plugins.CapacitorUpdater, { autoUpdate: false });
            fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));
          "
          cat capacitor.config.json
          { echo "### Versions used"; echo '```'; npm ls @capacitor/core @capgo/capacitor-updater 2>&1 | head -10 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Android project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      # In-app APK updates: a tiny native plugin that downloads the new APK
      # INSIDE the app (with progress) and opens Android's installer. This is
      # what replaces "open the browser and download there".
      - name: Add in-app APK installer plugin
        run: |
          APPID=$(node -p "require('./capacitor.config.json').appId")
          PKGDIR="android/app/src/main/java/${APPID//.//}"
          mkdir -p "$PKGDIR"

          cat > "$PKGDIR/ApkInstallerPlugin.java" <<'EOF'
          package __PKG__;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "ApkInstaller")
          public class ApkInstallerPlugin extends Plugin {

              private File apkFile() {
                  File dir = new File(getContext().getCacheDir(), "apk");
                  dir.mkdirs();
                  return new File(dir, "update.apk");
              }

              @PluginMethod
              public void canInstall(PluginCall call) {
                  boolean ok = Build.VERSION.SDK_INT < 26
                      || getContext().getPackageManager().canRequestPackageInstalls();
                  JSObject r = new JSObject();
                  r.put("allowed", ok);
                  call.resolve(r);
              }

              @PluginMethod
              public void openInstallSettings(PluginCall call) {
                  try {
                      Intent i = new Intent(
                          Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                          Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void download(final PluginCall call) {
                  final String url = call.getString("url");
                  if (url == null || url.isEmpty()) { call.reject("url required"); return; }

                  new Thread(new Runnable() {
                      @Override public void run() {
                          HttpURLConnection c = null;
                          try {
                              File out = apkFile();
                              File tmp = new File(out.getParentFile(), "update.part");
                              if (out.exists()) out.delete();
                              if (tmp.exists()) tmp.delete();

                              c = (HttpURLConnection) new URL(url).openConnection();
                              c.setInstanceFollowRedirects(true);   // GitHub redirects to its CDN
                              c.setConnectTimeout(15000);
                              c.setReadTimeout(30000);
                              c.connect();
                              if (c.getResponseCode() != 200) {
                                  call.reject("HTTP " + c.getResponseCode());
                                  return;
                              }
                              long total = c.getContentLengthLong();
                              InputStream in = c.getInputStream();
                              FileOutputStream os = new FileOutputStream(tmp);
                              byte[] buf = new byte[32768];
                              long done = 0;
                              int last = -1, n;
                              while ((n = in.read(buf)) > 0) {
                                  os.write(buf, 0, n);
                                  done += n;
                                  if (total > 0) {
                                      int pc = (int) (done * 100 / total);
                                      if (pc != last) {
                                          last = pc;
                                          JSObject p = new JSObject();
                                          p.put("percent", pc);
                                          notifyListeners("progress", p);
                                      }
                                  }
                              }
                              os.flush();
                              os.close();
                              in.close();
                              if (total > 0 && done != total) {
                                  tmp.delete();
                                  call.reject("incomplete download");
                                  return;
                              }
                              if (!tmp.renameTo(out)) {
                                  call.reject("could not save file");
                                  return;
                              }
                              call.resolve();
                          } catch (Exception e) {
                              call.reject(String.valueOf(e.getMessage()));
                          } finally {
                              if (c != null) c.disconnect();
                          }
                      }
                  }).start();
              }

              @PluginMethod
              public void install(PluginCall call) {
                  try {
                      File f = apkFile();
                      if (!f.exists()) { call.reject("no downloaded apk"); return; }
                      Uri uri = FileProvider.getUriForFile(
                          getContext(), getContext().getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          EOF

          cat > "$PKGDIR/MainActivity.java" <<'EOF'
          package __PKG__;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApkInstallerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          sed -i "s/__PKG__/$APPID/" "$PKGDIR/ApkInstallerPlugin.java" "$PKGDIR/MainActivity.java"

          # Android permission to launch the installer for our own downloaded APK
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES "$MANIFEST" || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' "$MANIFEST"

          # Let the FileProvider share files from the app cache
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="." />
              <cache-path name="my_cache_images" path="." />
              <files-path name="my_files" path="." />
          </paths>
          EOF

          grep -n "fileprovider\|REQUEST_INSTALL" "$MANIFEST" || true

      - name: Generate app icons
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      # Android only lets an APK update an installed app if both are signed with
      # the SAME key. We keep one keystore in a repo secret and reuse it.
      - name: Restore signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::DEBUG_KEYSTORE_B64 secret is missing. This APK gets a random key and will NOT update over older installs."
          else
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Set app version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      # The build tries 3 ways, so a problem with the live-update plugin can never
      # stop a release: (1) Java 17 + plugin, (2) Java 21 + plugin, (3) no plugin.
      - name: Build debug APK (Java 17, with live updates)
        id: build
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/gradle-java17.log"

      - name: Show why the Java 17 build failed
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning title=Live-update build failed on Java 17::Reason is in the run Summary (scroll down on the run page)."
          {
            echo "### Why the Java 17 build failed"
            echo '```'
            grep -A14 "What went wrong" gradle-java17.log | head -30 || true
            grep -E "^e: |error:|Caused by" gradle-java17.log | head -10 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Switch to Java 21
        if: steps.build.outcome == 'failure'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Build debug APK (Java 21, with live updates)
        id: build21
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --stop || true
          ./gradlew assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/gradle-java21.log"

      - name: Show why the Java 21 build failed
        if: steps.build21.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning title=Live-update build failed on Java 21::Reason is in the run Summary (scroll down on the run page)."
          {
            echo "### Why the Java 21 build failed"
            echo '```'
            grep -A14 "What went wrong" gradle-java21.log | head -30 || true
            grep -E "^e: |error:|Caused by" gradle-java21.log | head -10 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Switch back to Java 17
        if: steps.build.outcome == 'failure' && steps.build21.outcome == 'failure'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Fallback - build APK without live updates
        if: steps.build.outcome == 'failure' && steps.build21.outcome == 'failure'
        run: |
          echo "::warning::The live-update plugin could not be built. Making a plain APK instead. Students get in-app APK updates until this is fixed."
          npm uninstall @capgo/capacitor-updater
          npx cap sync android
          cd android
          ./gradlew --stop || true
          ./gradlew assembleDebug

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/*.apk GNHS-Quiz-Android.apk

      # The web files as a zip (index.html at the top). The installed app downloads this.
      - name: Make live-update bundle
        if: steps.build.outcome == 'success' || steps.build21.outcome == 'success'
        run: |
          WEBDIR=$(node -p "require('./capacitor.config.json').webDir || 'www'")
          (cd "$WEBDIR" && zip -qr "$GITHUB_WORKSPACE/www-bundle.zip" . -x '.*' -x '*/.*')
          unzip -l www-bundle.zip
          echo "::notice::Live-update bundle created. Installed apps will update without a new APK."

      - uses: actions/upload-artifact@v4
        with:
          name: GNHS-Quiz-Android
          path: |
            GNHS-Quiz-Android.apk
            www-bundle.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - run: npm test

      - name: Package Windows app (Electron wrapper around www, with auto-update)
        shell: bash
        run: |
          mkdir winapp
          cp -r www winapp/www
          mkdir -p winapp/build
          cp assets/icon-only.png winapp/build/icon.png

          cat > winapp/package.json <<'EOF'
          {
            "name": "gnhs-quiz",
            "version": "__VERSION__",
            "description": "GNHS Quiz",
            "author": "GNHS",
            "main": "main.js",
            "dependencies": {
              "electron-updater": "^6.3.0"
            },
            "build": {
              "appId": "com.gnhs.quiz",
              "productName": "GNHS Quiz",
              "files": ["main.js", "preload.js", "build/icon.png", "www/**/*"],
              "win": { "target": "nsis", "icon": "build/icon.png" },
              "nsis": {
                "oneClick": true,
                "perMachine": false,
                "artifactName": "GNHS-Quiz-Setup.exe"
              },
              "publish": {
                "provider": "github",
                "owner": "juliuscelio-del",
                "repo": "GNHS_Quiz"
              }
            }
          }
          EOF

          sed -i "s/__VERSION__/$VERSION/" winapp/package.json

          cat > winapp/main.js <<'EOF'
          const { app, BrowserWindow, Menu, ipcMain } = require('electron');
          const path = require('path');
          const { autoUpdater } = require('electron-updater');

          let win = null;
          const send = (s) => {
            if (win && !win.isDestroyed()) win.webContents.send('updater-status', s);
          };

          function createWindow() {
            win = new BrowserWindow({
              show: false,
              width: 1200,
              height: 800,
              autoHideMenuBar: true,
              icon: path.join(__dirname, 'build', 'icon.png'),
              webPreferences: {
                contextIsolation: true,
                webSecurity: false,
                preload: path.join(__dirname, 'preload.js')
              }
            });
            Menu.setApplicationMenu(null);
            win.loadFile(path.join(__dirname, 'www', 'index.html'));
            // Open maximized (no small-window flicker): show only when ready.
            win.once('ready-to-show', () => { win.maximize(); win.show(); });
          }

          function setupUpdater() {
            const current = app.getVersion();
            // Downloads in the background; installs when the app is closed,
            // or right away if the student taps "Restart now".
            autoUpdater.autoDownload = true;
            autoUpdater.autoInstallOnAppQuit = true;
            autoUpdater.on('checking-for-update', () => send({ state: 'checking', current }));
            autoUpdater.on('update-available', (i) => send({ state: 'available', current, version: i.version }));
            autoUpdater.on('update-not-available', () => send({ state: 'none', current }));
            autoUpdater.on('download-progress', (p) => send({ state: 'progress', current, percent: Math.round(p.percent) }));
            autoUpdater.on('update-downloaded', (i) => send({ state: 'downloaded', current, version: i.version }));
            autoUpdater.on('error', () => send({ state: 'error', current }));
          }

          // The page (updater.js) asks for a check each time the app opens.
          ipcMain.on('updater-check', () => {
            if (!app.isPackaged) return send({ state: 'none', current: app.getVersion() });
            autoUpdater.checkForUpdates().catch(() => send({ state: 'error', current: app.getVersion() }));
          });
          ipcMain.on('updater-install', () => autoUpdater.quitAndInstall(true, true));

          app.whenReady().then(() => {
            setupUpdater();
            createWindow();
          });
          app.on('window-all-closed', () => app.quit());
          EOF

          cat > winapp/preload.js <<'EOF'
          const { contextBridge, ipcRenderer } = require('electron');
          contextBridge.exposeInMainWorld('gnhsUpdater', {
            check: () => ipcRenderer.send('updater-check'),
            install: () => ipcRenderer.send('updater-install'),
            onStatus: (cb) => ipcRenderer.on('updater-status', (_e, s) => cb(s))
          });
          EOF

          cd winapp
          npm install
          npm install --save-dev electron@31 electron-builder@24
          npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: GNHS-Quiz-Windows
          path: |
            winapp/dist/GNHS-Quiz-Setup.exe
            winapp/dist/GNHS-Quiz-Setup.exe.blockmap
            winapp/dist/latest.yml
          if-no-files-found: error

  # One release job for both platforms, so the two builds never race to create
  # the same tag. updater.js reads www-bundle.zip (or the .apk as a fallback),
  # electron-updater reads latest.yml.
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: ls -R artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: GNHS Quiz v${{ env.VERSION }}
          files: |
            artifacts/GNHS-Quiz-Android/GNHS-Quiz-Android.apk
            artifacts/GNHS-Quiz-Android/www-bundle.zip
            artifacts/GNHS-Quiz-Windows/GNHS-Quiz-Setup.exe
            artifacts/GNHS-Quiz-Windows/GNHS-Quiz-Setup.exe.blockmap
            artifacts/GNHS-Quiz-Windows/latest.yml
